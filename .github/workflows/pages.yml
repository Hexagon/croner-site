name: Deploy Lumocs with GitHub Pages

on:
  push:
    branches: [main]

  # Picks up changes to the JavaScript pages in the croner repository
  schedule:
    - cron: "17 3 * * *"

  # Can be sent from the croner repository on release, with a token that may dispatch here
  repository_dispatch:
    types: [croner-release]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout croner (JavaScript pages)
        uses: actions/checkout@v7
        with:
          repository: Hexagon/croner
          path: croner

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Copy JavaScript pages
        run: deno task sync

      - name: Run Lume
        run: deno task build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
